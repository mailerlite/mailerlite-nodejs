name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke-test built package (CJS + ESM)
        run: |
          node -e "const M = require('./dist/index.js'); if (!new M.default({ api_key: 'x' }).subscribers) process.exit(1)"
          node --input-type=module -e "import M from './dist/index.mjs'; if (!new M({ api_key: 'x' }).subscribers) process.exit(1)"
      - run: npm test
        env:
          API_KEY: dummy
          VERIFIED_EMAIL: test@example.com
